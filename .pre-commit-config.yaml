repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: backend-tests
        name: Backend tests (pytest)
        entry: uv run pytest backend/tests/ -q --tb=short
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-tests
        name: Frontend tests (vitest)
        entry: npm run test --prefix frontend
        language: system
        pass_filenames: false
        always_run: true
