version: "3.8"

services:
  heirloom:
    build: .
    ports:
      - "8085:8000"
    volumes:
      - heirloom-data:/app/data
      - heirloom-photos:/app/photos
    environment:
      - DATABASE_URL=sqlite:////app/data/heirloom.db
      - PHOTOS_DIR=/app/photos
    restart: unless-stopped

volumes:
  heirloom-data:
  heirloom-photos:
